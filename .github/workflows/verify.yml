name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reviewer-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewer package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify checksums and finite fixtures
        run: python3 scripts/verify_bundle.py
